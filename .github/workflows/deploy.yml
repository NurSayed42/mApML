name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Download embedding model
        working-directory: backend
        run: python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"

      - name: Run unit tests with coverage
        working-directory: backend
        env:
          GEMINI_API_KEY: "test-key"
          DATABASE_URL: "postgresql+asyncpg://test:test@localhost/test"
          REDIS_URL: "redis://localhost:6379"
          CHROMA_URL: "http://localhost:8001"
          JWT_SECRET_KEY: "test-secret-key-for-ci-only-not-production"
          ENVIRONMENT: "test"
          ALLOWED_ORIGIN: "http://localhost:3000"
        run: |
          pytest tests/unit/ \
            --cov=. \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -v

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render Deploy
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  deploy-workers:
    name: Workers deploy automatically via Railway GitHub integration
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Railway deploys automatically
        run: echo "Railway workers deploy automatically on push to main via GitHub integration"

  notify:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [test]
    if: failure()

    steps:
      - name: Log failure
        run: echo "Pipeline failed on ${{ github.sha }}"
